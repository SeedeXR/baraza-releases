<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baraza VR - Release Notes</title>
<meta name="description" content="Release notes for Baraza VR, an Afro-futuristic VR courtroom drama for Meta Quest 3.">
<style>
  :root{
    --purple:#592F87; --purple-d:#432268; --orange:#F18814;
    --ink:#241a33; --muted:#6b6577; --line:#e7e2ef; --bg:#f6f4fa; --card:#ffffff;
    --added:#4CAF50; --changed:#592F87; --fixed:#F18814; --known:#9a5b2a; --removed:#C0392B;
  }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#ece8f4; --muted:#a79fbb; --line:#2e2640; --bg:#161022; --card:#1e1730; }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:var(--purple)}
  @media (prefers-color-scheme: dark){a{color:#b79be0}}
  header.top{background:linear-gradient(120deg,var(--purple),var(--purple-d));color:#fff;padding:34px 20px 30px}
  .top-inner{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .top img{height:52px;width:auto}
  .top h1{font-size:1.6rem;margin:0;font-weight:800;letter-spacing:.2px}
  .top p{margin:4px 0 0;opacity:.85;font-size:.95rem}
  main{max-width:820px;margin:0 auto;padding:28px 20px 60px}
  .rel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin:20px 0;
       box-shadow:0 1px 3px rgba(30,10,60,.05)}
  .rel-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:6px}
  .ver{font-size:1.35rem;font-weight:800;color:var(--purple)}
  @media (prefers-color-scheme: dark){.ver{color:#c3a9ec}}
  .date{color:var(--muted);font-size:.9rem}
  .badge{background:var(--orange);color:#fff;font-size:.68rem;font-weight:700;letter-spacing:.6px;
         padding:3px 9px;border-radius:20px;text-transform:uppercase}
  .intro{color:var(--muted);margin:10px 0 4px}
  .sec{margin-top:16px}
  .tag{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
       color:#fff;padding:3px 10px;border-radius:6px;margin-bottom:8px}
  .tag.added{background:var(--added)} .tag.changed{background:var(--changed)}
  .tag.fixed{background:var(--fixed)} .tag.known{background:var(--known)}
  .tag.removed{background:var(--removed)} .tag.other{background:var(--muted)}
  ul{margin:2px 0 4px;padding-left:22px} li{margin:4px 0}
  footer{max-width:820px;margin:0 auto;padding:24px 20px 50px;color:var(--muted);font-size:.85rem;
         border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .err{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;color:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <img src="assets/seede-logo.png" alt="Seede">
    <div>
      <h1>Baraza VR &middot; Release Notes</h1>
      <p>Afro-futuristic VR courtroom drama for Meta Quest 3</p>
    </div>
  </div>
</header>
<main id="notes"><div class="err">Loading release notes&hellip;</div></main>
<footer>
  <span>Seede &middot; Recreating Reality</span>
  <span id="src"></span>
</footer>

<script>
const TAGS = {
  "added":"added", "new":"added", "features":"added",
  "changed":"changed", "improved":"changed", "improvements":"changed",
  "fixed":"fixed", "fixes":"fixed",
  "known issues":"known", "known":"known",
  "removed":"removed", "deprecated":"removed"
};
function tagClass(name){ return TAGS[name.trim().toLowerCase()] || "other"; }
function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function parse(md){
  const lines = md.split(/\r?\n/);
  const versions = [];
  let v = null, sec = null;
  for(const raw of lines){
    const line = raw.replace(/\s+$/,'');
    let m;
    if((m = line.match(/^##\s+\[?([^\]]+?)\]?\s*(?:-\s*(.*))?$/)) && line.startsWith('## ')){
      v = { version:m[1].trim(), date:(m[2]||'').trim(), intro:[], sections:[] };
      versions.push(v); sec = null;
    } else if(v && (m = line.match(/^###\s+(.*)$/))){
      sec = { name:m[1].trim(), items:[] }; v.sections.push(sec);
    } else if(v && (m = line.match(/^[-*]\s+(.*)$/))){
      if(sec) sec.items.push(m[1].trim());
      else { sec = { name:'', items:[m[1].trim()] }; v.sections.push(sec); }
    } else if(v && line.trim() && !line.startsWith('#')){
      if(!sec) v.intro.push(line.trim());
    }
  }
  return versions;
}

function render(versions){
  if(!versions.length) return '<div class="err">No releases yet.</div>';
  return versions.map((v,i) => {
    const badge = i===0 ? '<span class="badge">Latest</span>' : '';
    const date = v.date ? `<span class="date">${esc(v.date)}</span>` : '';
    const intro = v.intro.length ? `<p class="intro">${esc(v.intro.join(' '))}</p>` : '';
    const secs = v.sections.map(s => {
      const items = s.items.map(it => `<li>${esc(it)}</li>`).join('');
      const head = s.name ? `<span class="tag ${tagClass(s.name)}">${esc(s.name)}</span>` : '';
      return `<div class="sec">${head}<ul>${items}</ul></div>`;
    }).join('');
    return `<article class="rel"><div class="rel-head"><span class="ver">${esc(v.version)}</span>${date}${badge}</div>${intro}${secs}</article>`;
  }).join('');
}

fetch('CHANGELOG.md', {cache:'no-store'})
  .then(r => { if(!r.ok) throw new Error(r.status); return r.text(); })
  .then(md => { document.getElementById('notes').innerHTML = render(parse(md)); })
  .catch(e => {
    document.getElementById('notes').innerHTML =
      '<div class="err">Could not load the changelog. See <a href="CHANGELOG.md">CHANGELOG.md</a>.</div>';
  });
document.getElementById('src').innerHTML =
  '<a href="CHANGELOG.md">CHANGELOG.md</a>';
</script>
</body>
</html>
